<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor">
        <header>
            <h1>Clima</h1>
            <p class="subtitulo">Consultá el clima actual y el pronóstico de cualquier ciudad</p>
        </header>

        <form id="form-busqueda" class="busqueda">
            <input
                type="text"
                id="input-ciudad"
                placeholder="Ej: Buenos Aires"
                autocomplete="off"
                required
            >
            <button type="submit">Buscar</button>
        </form>

        <p id="mensaje" class="mensaje"></p>

        <section id="clima-actual" class="tarjeta" hidden>
            <h2 id="ciudad">--</h2>
            <p id="pais" class="pais">--</p>

            <div class="principal">
                <span id="icono" class="icono">☀️</span>
                <span id="temperatura" class="temperatura">--°</span>
            </div>
            <p id="descripcion" class="descripcion">--</p>

            <div class="detalles">
                <div class="detalle">
                    <span class="etiqueta">Sensación</span>
                    <span id="sensacion" class="valor">--°</span>
                </div>
                <div class="detalle">
                    <span class="etiqueta">Humedad</span>
                    <span id="humedad" class="valor">--%</span>
                </div>
                <div class="detalle">
                    <span class="etiqueta">Viento</span>
                    <span id="viento" class="valor">-- km/h</span>
                </div>
            </div>
        </section>

        <!-- Tarjeta de Recomendación para Colgar Ropa -->
        <section id="tarjeta-ropa" class="tarjeta tarjeta-ropa" hidden>
            <div class="ropa-header">
                <span id="ropa-icono" class="ropa-icono">🧺</span>
                <div>
                    <h3 id="ropa-titulo">¿Se puede colgar la ropa?</h3>
                    <p id="ropa-estado" class="ropa-estado">--</p>
                </div>
            </div>
            <p id="ropa-motivo" class="ropa-motivo">--</p>
        </section>

        <section id="tarjeta-pronostico" class="tarjeta" hidden>
            <h3>Próximos días</h3>
            <ul id="pronostico" class="pronostico"></ul>
        </section>

        <footer>
            <p>Datos provistos por <a href="https://open-meteo.com" target="_blank">Open-Meteo</a></p>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
